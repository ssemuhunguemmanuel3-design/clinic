{% extends "base.html" %}
{% block content %}
{% set v = p or {} %}
<h2>{{ 'Edit patient' if p and p._id else 'New patient' }}</h2>
<form method="post" class="card grid">
  <label>Full name<input name="name" value="{{ v.name }}" required></label>
  <label>Date of birth<input name="dob" type="date" value="{{ v.dob }}"></label>
  <label>Gender
    <select name="gender">
      {% for g in ['', 'Female', 'Male', 'Other'] %}<option {{ 'selected' if v.gender == g }}>{{ g }}</option>{% endfor %}
    </select>
  </label>
  <label>Phone<input name="phone" value="{{ v.phone }}"></label>
  <label>Email<input name="email" type="email" value="{{ v.email }}"></label>
  <label>Address<input name="address" value="{{ v.address }}"></label>
  <label>Blood group
    <select name="blood_group">
      {% for b in ['', 'A+', 'A-', 'B+', 'B-', 'AB+', 'AB-', 'O+', 'O-'] %}<option {{ 'selected' if v.blood_group == b }}>{{ b }}</option>{% endfor %}
    </select>
  </label>
  <label>Allergies<input name="allergies" value="{{ v.allergies }}"></label>
  <label>Emergency contact<input name="emergency_contact" value="{{ v.emergency_contact }}"></label>
  <label class="wide">Notes<textarea name="notes" rows="3">{{ v.notes }}</textarea></label>
  <div class="wide"><button>Save</button> <a href="{{ url_for('patients_list') }}">Cancel</a></div>
</form>
{% endblock %}
